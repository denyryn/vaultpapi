version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: vaultpapi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultpapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vaultpapi-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: "postgres://postgres:postgres@postgres:5432/vaultpapi?sslmode=disable"
      JWT_SECRET: "change-this-to-a-secure-secret-at-least-32-bytes"
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
