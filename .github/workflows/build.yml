name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Build server
        run: |
          cd server
          go build -o vaultpapi ./cmd/server

      - name: Build extension
        run: |
          cd extension
          npm ci
          npm run build

      - name: Pack extension
        run: |
          cd extension
          zip -r vaultpapi-extension.zip dist

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/vaultpapi
            extension/dist/**
            extension/vaultpapi-extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            server/vaultpapi
            extension/dist/**
            extension/vaultpapi-extension.zip
          retention-days: 7
