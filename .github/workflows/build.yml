name: Build and Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: extension/package-lock.json

            - name: Build server
              run: |
                  cd server
                  make build

            - name: Build extension
              run: |
                  cd extension
                  npm ci
                  npm run build

            - name: Pack extension
              run: |
                  cd extension/dist
                  zip -r ../vaultpapi-extension.zip .

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      server/bin/vaultpapi
                      extension/vaultpapi-extension.zip
                  generate_release_notes: true

            - name: Upload artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifacts
                  path: |
                      server/bin/vaultpapi
                      extension/vaultpapi-extension.zip
                  retention-days: 7
